<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 46" shape-rendering="crispEdges" role="img" aria-labelledby="title desc">
  <title id="title">Rory the pixel-art purple tiger</title>
  <desc id="desc">An original blocky purple tiger with lavender ears, dark stripes, bright eyes, a curled tail, and a green study card.</desc>
  <!-- Integer-aligned shapes keep the pixel silhouette crisp at any size. -->
  <path fill="#1B4332" opacity=".12" d="M12 42h25v1H12zM9 41h31v1H9z"/>
  <!-- Curled tail and its stripes. -->
  <path fill="#44285C" d="M34 29h4v2h4v-3h-3v-2h-1v-4h2v-1h4v1h2v7h-1v4h-2v2h-9z"/>
  <path fill="#7A4E9D" d="M35 30h3v2h5v-3h1v-6h-1v-1h-3v1h-1v2h1v1h3v2h-1v1h-2v2h-5z"/>
  <path fill="#C9B6E4" d="M40 22h3v1h-3z"/>
  <path fill="#44285C" d="M43 24h2v2h-2zM42 31h2v2h-2zM37 32h2v2h-2z"/>
  <!-- Body and feet. -->
  <path fill="#44285C" d="M15 27h18v3h2v5h1v6h-2v1h-7v-2h-7v2h-7v-1h-2v-6h1v-5h3z"/>
  <path fill="#7A4E9D" d="M16 28h16v3h2v5h1v4h-7v-2h-9v3h-6v-1h-1v-4h1v-5h3z"/>
  <path fill="#C9B6E4" d="M20 29h8v1h2v8H18v-8h2zM13 39h6v2h-6zM28 39h6v2h-6z"/>
  <path fill="#44285C" d="M13 32h4v2h-4zM12 36h5v2h-5zM30 32h4v2h-4zM30 36h5v2h-5zM15 39h1v2h-1zM18 39h1v2h-1zM29 39h1v2h-1zM32 39h1v2h-1z"/>
  <!-- Ears and stepped head outline. -->
  <path fill="#44285C" d="M10 7h6v1h2v2h12V8h2V7h6v1h2v8h-1v8h-2v3h-3v2H14v-2h-3v-3H9v-8H8V8h2zM18 8h12v2H18z"/>
  <path fill="#7A4E9D" d="M10 8h6v1h1v5h-7zM32 9h1V8h5v1h1v5h-7zM17 10h14v1h4v3h3v9h-2v3h-3v2H15v-2h-3v-3h-2v-9h3v-3h4z"/>
  <path fill="#C9B6E4" d="M11 10h4v1h1v3h-3v-1h-2zM34 10h3v3h-1v1h-3v-3h1zM15 12h4v1h-4zM13 13h2v2h-2z"/>
  <!-- Forehead, cheeks, and brows. -->
  <path fill="#44285C" d="M20 10h2v4h-1v-1h-1zM25 10h2v3h-1v1h-1zM10 17h5v1h2v1h-7zM10 22h6v1h-2v1h-3v-1h-1zM33 17h5v2h-7v-1h2zM32 22h6v1h-1v1h-3v-1h-2zM17 16h4v1h-4zM27 16h4v1h-4z"/>
  <!-- Eyes with one-pixel highlights. -->
  <path fill="#1B4332" d="M18 18h3v4h-3zM27 18h3v4h-3z"/>
  <path fill="#EFE6DD" d="M19 18h1v1h-1zM28 18h1v1h-1z"/>
  <!-- Muzzle, nose, smile, and whiskers. -->
  <path fill="#EFE6DD" d="M19 22h10v1h3v3h-2v1H18v-1h-2v-3h3zM12 23h3v1h-3zM12 26h3v1h-3zM33 23h3v1h-3zM33 26h3v1h-3z"/>
  <path fill="#1B4332" d="M22 22h4v1h-1v1h-2v-1h-1zM23 24h2v2h2v-1h1v2h-3v-1h-2v1h-3v-2h1v1h2z"/>
  <!-- Study card and pixel check mark. -->
  <path fill="#1B4332" d="M18 29h13v1h1v8H17v-8h1z"/>
  <path fill="#40916C" d="M19 30h11v7H19z"/>
  <path fill="#EFE6DD" d="M27 31h2v2h-1v1h-1v1h-1v1h-2v-1h-1v-1h-1v-2h2v1h1v1h1v-2h1z"/>
  <!-- Lavender paws wrap around the card. -->
  <path fill="#44285C" d="M14 30h3v1h1v4h-1v1h-3v-1h-1v-4h1zM31 30h3v1h1v4h-1v1h-3v-1h-1v-4h1z"/>
  <path fill="#C9B6E4" d="M14 31h3v4h-3zM31 31h3v4h-3z"/>
</svg>
